<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>會員中心</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <h1>會員中心</h1>
    <main class="container">
      <div class="row">
        <div class="col-lg-3">
          <ul class="list-group">
            <li class="list-group-item">
              <div class="d-flex flex-lg-wrap justify-content-lg-center">
                <div class="userImg"><img src="" alt="使用者頭像" /></div>
                <section class="text-lg-center">
                  <h2 class="h4">Josh</h2>
                  <p>helloworld@gmail.com</p>
                  <p class="badge text-bg-success">已驗證</p>
                </section>
              </div>
            </li>
            <li class="list-group-item active">
              <i class="bi bi-person"></i> 個人資料
            </li>
            <li class="list-group-item">
              <i class="bi bi-laptop"></i> 我上架的 AI 工具
            </li>
            <li class="list-group-item">
              <i class="bi bi-list-ul"></i> 我訂閱的 AI 工具
            </li>
          </ul>
        </div>
        <div class="col-lg-9">
          <section>
            <!-- 個人資料 -->
            <form>
                <section class="bg-white round">
                    <h2 class="h4">基本資料</h2>
                    <div class="row">
                        <div class="col-12 col-lg-6">
                            <label for="userName" class="from-label">姓名 <span class="text-danger">*</span></label>
                            <input id="userName" name="userName" type="text" class="form-control" placeholder="Josh" value="Josh"/>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="nickname" class="from-label">暱稱 <span class="text-danger">*</span></label>
                            <input id="nickname" name="nickname" type="text" class="form-control" placeholder="請輸入你的暱稱"/>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="email" class="from-label">聯絡信箱 <span class="text-danger">*</span></label>
                            <input id="email" name="email" type="text" class="form-control" placeholder="helloworld@gmail.com" value="helloworld@gmail.com"/>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="phone" class="from-label">聯絡電話 <span class="text-danger">*</span></label>
                            <input id="phone" name="phone" type="tel" class="form-control" placeholder="0912345678"/>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label for="day" class="from-label"> <span class="text-danger">*</span></label>
                            <input id="day" name="day" type="date" class="form-control" placeholder="請輸入"/>
                        </div>
                    </div>
                </section>
            </form>
          </section>
          <section>
            <h2 class="h4">頁籤2</h2>
          </section>
          <section>
            <h2 class="h4">頁籤3</h2>
          </section>
          <section>
            <h2 class="h4">頁籤4</h2>
          </section>
          <section>
            <h2 class="h4">頁籤5</h2>
          </section>
        </div>
      </div>
    </main>
    <%- include('./layout/footer'); -%>
    <script type="module" src="../main.js"></script>
  </body>
</html>
