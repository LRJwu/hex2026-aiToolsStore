<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <title>註冊｜歡迎加入 AI ToolVerse</title>
</head>

<body>
  <%- include('./layout/header'); -%>
    <main class="bg-neu text-white min-vh-100 bg-1 backdrop-blur">
      <section class="container text-center d-flex justify-content-center align-items-center py-5 py-lg-9">
        <div class="col-12 col-md-6 col-lg-4 d-grid gap-5">
          <div>
            <h1 class="h3 h2-lg mb-4"> 歡迎加入 AI ToolVerse </h1>
            <h2 class="fs-bmd fs-lg-blg text-neu-200 mb-1"> 立即建立帳號，開始探索 AI 工具 </h2>
          </div>
          <form class="d-grid gap-3 mx-auto w-100">
            <button type="button" class="btn btn-outline-purple text-purple-100"><i class="bi"><img
                  src="/assets/images/index/login-google.png" class="img-fulid"></i>使用 Google 繼續</button>
            <button type="button" class="btn btn-outline-purple text-purple-100"><i class="bi"><img
                  src="/assets/images/index/login-facebook.png" class="img-fulid"></i>使用 Facebook 繼續</button>
            <button type="button" class="btn btn-outline-purple text-purple-100"><i class="bi"><img
                  src="/assets/images/index/login-apple.png" class="img-fulid"></i>使用 Apple 繼續</button>
          </form>
          <h3 class="divider fs-bsm text-neu-200 d-flex justify-content-center align-items">或使用 AI ToolVerse 帳號登入</h3>
          <form class="d-grid gap-3 mx-auto w-100 text-start">
            <div class="mb-3">
              <label class="form-label" for="inputEmail">電子信箱</label>
              <input class="form-control text-black" id="inputEmail" name="inputEmail" type="email"
                placeholder="請輸入電子信箱">
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">密碼</label>
              <div class="input-group">
                <input id="inputPassword" name="inputPassword" class="form-control text-black border-end-0"
                placeholder="請輸入密碼" type="password">
                <span class="input-group-text"><i class="bi bi-eye-slash"></i></span>
              </div>
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">確認密碼</label>
              <div class="input-group">
                <input id="inputPassword" name="inputPassword" class="form-control text-black border-end-0"
                placeholder="請再次輸入密碼" type="password">
                <span class="input-group-text"><i class="bi bi-eye-slash"></i></span>
              </div>
              <div id="passwordHelpBlock" class="d-flex justify-content-between mt-2">
                <div>
                  <input class="accent-purple form-check-input" id="ConfirmPassword" type="checkbox" name="remberpassword">
                  <label class="text-neu-200" for="remberpassword">
                    我同意 
                    <a href="" class="text-purple-200 text-decoration-underline" data-bs-toggle="modal" data-bs-target="#TOSModal" data-bs-whatever="服務條款">服務條款</a>
                     與 
                    <a href="" class="text-purple-200 text-decoration-underline" data-bs-toggle="modal" data-bs-target="#TOSModal" data-bs-whatever="隱私政策">隱私政策</a>
                  </label>
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-purple">註冊</button>
          </form>
          <p class="fs-bsm">已經有帳號了？<a href="login.html" class="text-purple text-decoration-underline">立即登入</a></p>

        </div>
      </section>
    </main>
<div class="modal fade" id="TOSModal" tabindex="-1" aria-labelledby="TOSModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="TOSModalLabel">關於我們的<span class="text-purple"></span></h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h2>內容</h2>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-purple" data-bs-dismiss="modal">確認</button>
      </div>
    </div>
  </div>
</div>
  <script type="module" src="../main.js"></script>
  <script>
const TOSModal = document.getElementById('TOSModal')
if (TOSModal) {
  TOSModal.addEventListener('show.bs.modal', event => {
    // Button that triggered the modal
    const button = event.relatedTarget
    // Extract info from data-bs-* attributes
    const recipient = button.getAttribute('data-bs-whatever')
    // If necessary, you could initiate an Ajax request here
    // and then do the updating in a callback.

    // Update the modal's content.
    const modalTitle = TOSModal.querySelector('.modal-title span')
    const modalBodyTitle = TOSModal.querySelector('.modal-body h2')

    modalTitle.textContent = recipient
    modalBodyTitle.textContent = `${recipient}包含：`
  })
}    
  </script>  
</body>

</html>
